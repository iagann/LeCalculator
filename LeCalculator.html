<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>LE Calculator by iagan3228</title>

  <!-- Sortable.js (CDN) for drag & drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  
  <script>
  (function() {
    // 1. Centralized Version Control
    const v = "20260220_02"; 
    
    // 2. Asset Definitions
    const styles = [
      'general', 'main', 'buildList', 'summary', 'dragDrop', 'hoverMenu'
    ];

    const scriptsCritical = [
      'stats'
    ];
    
    const scripts = [
      'jsonHandler', 'sections', 'sectionsSearch', 
      'statsManager', 'dragDrop', 'summary', 'buildManager'
    ];

    // 3. Inject Styles
    styles.forEach(name => {
      document.write(`<link rel="stylesheet" href="css/${name}.css?v=${v}">`);
    });

    // 4. Inject Stats (Blocking - must be first)
    scriptsCritical.forEach(name => {
      document.write(`<script src="js/${name}.js?v=${v}"><\/script>`);
    });


    // 5. Inject Logic (Deferred - preserves order)
    scripts.forEach(name => {
      document.write(`<script defer src="js/${name}.js?v=${v}"><\/script>`);
    });
  })();
</script>
</head>
<body>
  <div id="loading-overlay">
    LE Calculator is initializing...
  </div>

  <!-- Left panel (collapsible) -->
  <div id="left-panel">
    <div class="left-panel-content">
      <h2>Builds</h2>

      <button onclick="createNewBuild()">New</button>
      <!--button id="copy-build-btn" onclick="copyBuildCodeToClipboard()">Copy</button>
      <button onclick="openLoadDialog()">Load</button-->
      <button onclick="exportBuildToFile()">Export</button>
      <button onclick="document.getElementById('file-import-input').click()">Import</button>
      <input type="file" id="file-import-input" style="display: none;" accept=".json" onchange="importBuildFromFile(event)">
      
      <hr />

      <!-- List of local saved builds (draggable) -->
      <ul id="build-list"></ul>
    </div>
  </div>

  <!-- Toggle button (placed separately outside the panel) -->
  <button id="toggle-panel-btn" onclick="toggleLeftPanel()">◄</button>
  <script>
    (function() {
      // Execute synchronously before the browser paints the screen
      const panel = document.getElementById("left-panel");
      const btn = document.getElementById("toggle-panel-btn");
      if (window.localStorage.getItem("leftPanelCollapsed") === "true") {
        panel.classList.add("collapsed");
        btn.textContent = "►";
      }
    })();
  </script>

  <!-- Main container: includes the middle and right panels -->
  <div class="container">

    <!-- .main-area (slides left/right) -->
    <div class="main-area">
      <div class="main-content">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a target="_blank" href="https://lastepoch.com/"><img src="pngaaa.com-4901781.png" alt="Logo" style="height: 60px; padding-bottom: 20px;"></a>
          <h1 id="topTitle">Build Stats Calculator by iagan3228</h1>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <label for="buildNameInput">Build Name:</label>
          <input type="text" id="buildNameInput" placeholder="My Cool Build" style="flex: 1;">
        </div>

        <hr />

        <div class="section-controls">
          <h2>Categories:</h2>
          <button onclick="addCategory()">Add</button>
          <button onclick="expandAllCategories()">Expand</button>
          <button onclick="collapseAllCategories()">Collapse</button>
          <h2>Stats:</h2>
          <!--button onclick="addSection()">Add</button-->
          <button onclick="expandAllSections()">Expand</button>
          <button onclick="collapseAllSections()">Collapse</button>
          <div class="search-wrapper">
            <!--button onclick="setSectionSearch('[skill]')">S</button>
            <div class="hover-menu">
              <button onclick="setSectionSearch('[item]')" aria-haspopup="true" aria-expanded="false">E</button>
               <div class="panel" role="menu" aria-label="Section shortcuts">
                <button role="menuitem" onclick="setSectionSearch('[item][helm]')">helm</button>
                <button role="menuitem" onclick="setSectionSearch('[item][amulet]')">amulet</button>
                <button role="menuitem" onclick="setSectionSearch('[item][weapon]')">weapon</button>
                <button role="menuitem" onclick="setSectionSearch('[item][offhand]')">offhand</button>
                <button role="menuitem" onclick="setSectionSearch('[item][body]')">body</button>
                <button role="menuitem" onclick="setSectionSearch('[item][ring]')">ring</button>
                <button role="menuitem" onclick="setSectionSearch('[item][belt]')">belt</button>
                <button role="menuitem" onclick="setSectionSearch('[item][gloves]')">gloves</button>
                <button role="menuitem" onclick="setSectionSearch('[item][boots]')">boots</button>
                <button role="menuitem" onclick="setSectionSearch('[item][relic]')">relic</button>
              </div>
            </div>
            <button onclick="setSectionSearch('[idol]')">I</button>
            <button onclick="setSectionSearch('[passive]')">P</button>
            <button onclick="setSectionSearch('[blessing]')">B</button-->
            <input type="text" id="section-search" placeholder="Search Sections or Stats..." oninput="filterSectionsByName()" list="section-stat-options">
            <button id="clear-search" onclick="clearSectionSearch()" title="Clear Search">✖</button>
            <datalist id="section-stat-options"></datalist>
          </div>
        
          <!-- These two are added dynamically via JS when search is active -->
          <button id="expand-visible" onclick="expandVisibleSections()" style="display: none;">Expand Visible</button>
          <button id="collapse-visible" onclick="collapseVisibleSections()" style="display: none;">Collapse Visible</button>

          <!--select id="sort-select" onchange="applySectionSort()" style="display: none;">
            <option value="">Sort by Impact...</option>
          </select>
          <label style="display: none;" id="sort-reverse-label">
            <input type="checkbox" id="sort-reverse-cb">
            Reverse Sort Order
          </label-->
          <button id="reset-contributions" onclick="resetAllContributions()" title="Uncheck all enabled stats">
            Remove All Impacts
          </button>
        </div>
        

        <hr />

        <div id="sections"></div>
      </div>
    </div>

    <!-- Right panel for summary -->
    <div class="summary-panel">
      <h2>Stat Summary</h2>
      <div id="summary-content"></div>
    </div>

  </div>

  <button id="scroll-top-btn" type="button" aria-label="Scroll to top" hidden>↑</button>

  <!-- Load dialog for pasting base64 build code -->
  <div id="loadDialog" class="dialog">
    <div class="dialog-content">
      <p>Paste your Build Code:</p>
      <input type="text" id="loadInput" placeholder="Paste code here..." />
      <button id="closeLoadDialogBtn" class="btn-close" onclick="closeLoadDialog()">Close</button>
    </div>
  </div>

</body>
</html>
